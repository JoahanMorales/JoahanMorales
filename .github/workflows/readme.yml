# The README and every image in it are generated from data/profile.json by scripts/build_readme.py.
# It runs when the data or the script change, and once a day for the live numbers (activity, stars, release).
name: readme
on:
  push:
    branches: [main]
    paths: [data/**, scripts/**, assets/fonts/**, assets/shots/**]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools uharfbuzz
      - run: python scripts/build_readme.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git add README.md assets/gen assets/icons
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "README: rebuilt from data/profile.json"
          git push

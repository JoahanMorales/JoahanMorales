# Draws the contribution graph in the profile's violet, once a day, into the "output" branch the README reads.
name: contributions
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contributions-dark.svg?palette=github-dark&color_snake=#a78bfa&color_dots=#161b22,#2e1f5e,#4c2fa0,#7c4dff,#b69cff
            dist/contributions-light.svg?color_snake=#6d28d9&color_dots=#efedf5,#ddd3fb,#b8a2f5,#8b5cf6,#5b21b6
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
